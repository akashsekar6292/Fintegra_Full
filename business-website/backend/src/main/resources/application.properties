spring.application.name=fintegra-website
server.port=${SERVER_PORT:8088}

# Import DB credentials / datasource from a dedicated file (env-overridable).
spring.config.import=optional:classpath:application-db.properties

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS allowlist (comma-separated). Override in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3847,http://127.0.0.1:3847}

# Logging — never dump request bodies / PII at INFO
logging.level.root=INFO
logging.level.com.example.website=INFO
logging.level.org.hibernate.SQL=WARN
