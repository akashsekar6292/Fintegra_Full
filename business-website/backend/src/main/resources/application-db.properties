# Database configuration — set DB_URL / DB_USERNAME / DB_PASSWORD in your environment.
# Never commit real credentials. See backend/env.example and the project README.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/business_website?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
